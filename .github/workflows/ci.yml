name: Build, Test, Package & Release

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  build-and-test:
    # Лёгкая проверка на дефолтном ubuntu: тесты + статический анализ.
    # Полный плагин (KF6) тут не собирается (KF6 нет в узле), поэтому BUILD_ONLY_TESTS=ON.
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies (tests only)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            cmake g++ make qt6-base-dev libqalculate-dev clang-tidy cppcheck

      - name: Configure (tests only)
        run: |
          cmake -B build \
                -DCMAKE_BUILD_TYPE=Debug \
                -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
                -DBUILD_ONLY_TESTS=ON

      - name: Build tests
        run: cmake --build build -j$(nproc)

      - name: Run tests
        run: |
          cd build && ctest --output-on-failure -V

      - name: Static analysis — clang-tidy
        run: |
          clang-tidy --version
          find src/ tests/ -name '*.cpp' -o -name '*.h' \
            | xargs clang-tidy -p build --quiet 2>&1 || true
        continue-on-error: true

      - name: Static analysis — cppcheck
        run: |
          cppcheck --enable=all \
                   --std=c++17 \
                   --suppress=syntaxError \
                   --suppress=unknownMacro \
                   --suppress=unmatchedSuppression \
                   --inline-suppr \
                   --language=c++ \
                   -I src/ -I tests/ \
                   src/ tests/ \
                   2>&1 || true
        continue-on-error: true

  package:
    # Сборка ПОЛНОГО плагина (нужны KF6 + krunner headers) и упаковка в tar.gz.
    # Выполняется в Arch Linux (base-devel) — там KF6-плагины и libqalculate
    # есть в официальных репозиториях, сборка надёжна и быстра.
    if: startsWith(github.ref, 'refs/tags/v')   # пакет собираем только на тегах релизов
    runs-on: ubuntu-24.04
    container:
      image: archlinux:base-devel
    steps:
      - name: Install build dependencies
        run: |
          pacman -Syu --noconfirm --needed \
            cmake gcc make \
            qt6-base krunner kcoreaddons kconfig ki18n \
            extra-cmake-modules libqalculate

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure (full plugin)
        run: |
          cmake -B build \
                -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
                -DBUILD_TESTING=OFF \
                -DBUILD_ONLY_TESTS=OFF

      - name: Build full plugin
        run: cmake --build build -j$(nproc)

      - name: Package prebuilt archive
        run: |
          chmod +x scripts/package.sh scripts/install-prebuilt.sh
          ./scripts/package.sh build dist

      - name: Upload archive to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/krunner-qalculator-*.tar.gz
          fail_on_unmatched_files: true
